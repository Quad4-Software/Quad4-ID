name: Update AAGUIDs

on:
  schedule:
    - cron: "0 0 * * 1" # Runs every Monday at midnight
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: read

jobs:
  update-aaguids:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Update AAGUIDs and authenticator icons
        run: go run scripts/update-aaguids.go

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet; then
            echo "No AAGUID updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

          branch="update-aaguids"
          git checkout -B "$branch"
          git commit -am "chore: update AAGUIDs"
          git push --force-with-lease origin "$branch"

          # Reuse an existing pull request for the branch if one is already open
          if ! gh pr view "$branch" --json number > /dev/null 2>&1; then
            gh pr create \
              --title "chore: update AAGUIDs" \
              --body "This PR updates the AAGUID metadata and authenticator icons with the latest data from the passkey-aaguids repository." \
              --head "$branch" \
              --base master
          fi
