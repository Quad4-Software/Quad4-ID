# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[git]
conventional_commits = true
filter_unconventional = true
# Strip references to pull requests and users so release notes only ever contain subjects and commit links
commit_preprocessors = [
        { pattern = '\((\w+\s)?#\d+\)', replace = "" },
        { pattern = '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#\d+', replace = "" },
        { pattern = '\B#\d+\b', replace = "" },
        { pattern = '(^|[^A-Za-z0-9_])@([A-Za-z0-9_-]+)', replace = "$1$2" },
        { pattern = '\s+$', replace = "" },
]
commit_parsers = [
        { message = "^feat", group = "Features" },
        { message = "^fix", group = "Bug Fixes" },
        { message = "^docs", group = "Documentation" },
        { message = "^perf", group = "Performance Improvements" },
        { message = "^release:", skip = true },
        { message = "^chore: import", skip = true },
        { message = ".*", group = "Other", default_scope = "other"},
]
filter_commits = false

[bump]
no_increment_regex = "^(chore|ci|docs|refactor|style|test)"

[changelog]
format = true
trim = true
body = """
## {{ version | default(value="Unknown Version") }}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | title }}
{% for commit in entry.commits %}
  - {{ commit.message | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Quad4-Software/Quad4-ID/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{% if version -%}
    {% if previous.version -%}
      **Full Changelog**: https://github.com/Quad4-Software/Quad4-ID/compare/{{ previous.version }}...{{ version }}
    {% endif %}
{% else -%}
  {% raw %}\n{% endraw %}
{% endif %}
"""
