# This Docker Compose file is used to set up the environment for the tests.
services:
  lldap:
    extends:
      file: docker-compose.yml
      service: lldap
  scim-test-server:
    extends:
      file: docker-compose.yml
      service: scim-test-server
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quad4-id
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
  quad4-id:
    extends:
      file: docker-compose.yml
      service: quad4-id
    environment:
      - APP_ENV=test
      - DB_CONNECTION_STRING=postgres://postgres:postgres@postgres:5432/quad4-id
      - FILE_BACKEND=${FILE_BACKEND}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  quad4-id-test-data:
