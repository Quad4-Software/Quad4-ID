# This Docker Compose file is used to set up the environment for the tests.
services:
  lldap:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LLDAP_JWT_SECRET=secret
      - LLDAP_LDAP_USER_EMAIL=admin@quad4-id.test
      - LLDAP_LDAP_USER_PASS=admin_password
      - LLDAP_LDAP_BASE_DN=dc=quad4-id,dc=test
  scim-test-server:
    image: ghcr.io/pocket-id/scim-test-server:latest
    ports:
      - '18123:8080'
  quad4-id:
    image: quad4-id:test
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '1411:1411'
    environment:
      APP_ENV: test
      ENCRYPTION_KEY: test-encryption-key
      FILE_BACKEND: ${FILE_BACKEND}
      OUTBOUND_ALLOWED_HOSTS_BACKCHANNEL_LOGOUT: private,loopback,host.docker.internal
      OUTBOUND_ALLOWED_HOSTS_SCIM: private,loopback,host.docker.internal
      OUTBOUND_ALLOWED_HOSTS_FEDERATED_JWKS: private,loopback,host.docker.internal
    volumes:
      - quad4-id-test-data:/app/data
    build:
      args:
        - BUILD_TAGS=e2etest
      context: ../..
      dockerfile: docker/Dockerfile

volumes:
  quad4-id-test-data:
