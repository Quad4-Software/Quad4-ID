# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=jcroql
version: 2

project_name: quad4-id

before:
  hooks:
    - vp install --frozen-lockfile
    - vp -C frontend run build
    - mkdir -p .tmp
    - mv backend/frontend/dist/cyclonedx/frontend.cdx.json .tmp/frontend.cdx.json
    - rm -r backend/frontend/dist/cyclonedx

builds:
  - id: quad4-id
    main: ./cmd
    dir: backend
    binary: quad4-id
    env:
      - CGO_ENABLED=0
      - GOMAXPROCS=2
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    goamd64:
      - v1
    go386:
      - sse2
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: "386"
      - goos: openbsd
        goarch: arm
    ldflags:
      - -w -s
      - -buildid={{ .Version }}
      - -X github.com/pocket-id/pocket-id/backend/internal/common.Version={{ .Version }}
    flags:
      - -trimpath
      - -p=2
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - binary
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

checksum:
  name_template: checksums.txt

sboms:
  - id: binaries
    artifacts: binary
    documents:
      - "quad4-id_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ targetVariant . }}.sbom.spdx.json"
    cmd: sh
    args:
      - ../scripts/development/generate-binary-sbom.sh
      - $artifact
      - $document
      - "quad4-id_{{ .Os }}_{{ .Arch }}{{ targetVariant . }}"
      - "{{ .Version }}"
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false
      - SYFT_CACHE_DIR=

changelog:
  disable: true

release:
  github:
    owner: Quad4-Software
    name: Quad4-ID
  draft: false
  prerelease: auto
  make_latest: true
  mode: keep-existing
  name_template: "{{ .Tag }}"
